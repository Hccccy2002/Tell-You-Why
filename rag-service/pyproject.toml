[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tellwhy-kb"
version = "0.1.0"
description = "Local, resumable PDF preparation and retrieval for Tell You Why"
requires-python = ">=3.11,<3.13"
dependencies = ["pypdf>=6", "pypdfium2>=4", "Pillow>=11", "numpy>=2", "pydantic>=2", "PyYAML>=6", "jieba==0.42.1", "sentence-transformers==6.0.1", "paddleocr==3.7.0", "paddlex==3.7.2", "paddlepaddle==3.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12", "reportlab>=4"]

[project.scripts]
tellwhy-kb = "tellwhy_kb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires actual model resources"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
